[project]
name = "media-processor"
version = "0.1.0"
description = "Microservice for extracting and chunking educational media (YouTube, PDFs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "youtube-transcript-api>=0.6.2",
    "pymupdf>=1.24.4",
    "langchain-text-splitters>=0.2.1",
    "pydantic>=2.7.4",
    "python-multipart>=0.0.9"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.4.8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
